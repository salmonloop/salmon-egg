name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.3xx"
  CONFIGURATION: "Release"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update --disable-parallel --no-http-cache

      - name: Restore dependencies
        run: dotnet restore SalmonEgg.sln

      - name: Detect changed C# files
        id: changed_cs
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "pull_request")
          {
              $baseRef = "${{ github.base_ref }}"
              $head = "${{ github.event.pull_request.head.sha }}"
              git fetch --no-tags origin $baseRef
              $base = git merge-base "origin/$baseRef" $head
          }
          else
          {
              $base = "${{ github.event.before }}"
              $head = "${{ github.sha }}"
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq "0000000000000000000000000000000000000000")
          {
              $base = "HEAD~1"
          }

          $changed = git diff --name-only $base $head -- "*.cs"
          $existing = @($changed | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path $_) })

          if ($existing.Count -eq 0)
          {
              "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
          }

          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $existing | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check formatting
        if: steps.changed_cs.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $raw = @"
          ${{ steps.changed_cs.outputs.files }}
          "@
          $files = $raw -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          dotnet format SalmonEgg.sln --verify-no-changes --no-restore --include $files

      - name: Build with analyzers
        run: dotnet build SalmonEgg.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:EnforceCodeStyleInBuild=true
