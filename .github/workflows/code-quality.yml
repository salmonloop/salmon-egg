name: Code Quality

on:
  push:
    branches: [main, develop]
    paths-ignore:
      # Documentation-only edits cannot change build or test outcomes, and running the heavy platform
      # matrix for them costs runner minutes while adding no signal. Listed explicitly rather than as
      # `**.md`: src/SalmonEgg.Acp/README.md is packed into the published nupkg, so it is shipping
      # content and must keep triggering its gates.
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [develop]
    paths-ignore:
      # Documentation-only edits cannot change build or test outcomes, and running the heavy platform
      # matrix for them costs runner minutes while adding no signal. Listed explicitly rather than as
      # `**.md`: src/SalmonEgg.Acp/README.md is packed into the published nupkg, so it is shipping
      # content and must keep triggering its gates.
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"

# Least privilege by default: every job here only reads the repository. The one job that needs to
# write (release asset upload) raises it locally. Without this block the workflow inherits whatever
# the repository default happens to be, which is a setting that can drift without a code change.
permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.3xx"
  CONFIGURATION: "Release"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update --disable-parallel --no-http-cache

      - name: Restore dependencies
        run: dotnet restore SalmonEgg.sln

      - name: Detect changed C# files
        id: changed_cs
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "pull_request")
          {
              $baseRef = "${{ github.base_ref }}"
              $head = "${{ github.event.pull_request.head.sha }}"
              git fetch --no-tags origin $baseRef
              $base = git merge-base "origin/$baseRef" $head
          }
          else
          {
              $base = "${{ github.event.before }}"
              $head = "${{ github.sha }}"
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq "0000000000000000000000000000000000000000")
          {
              $base = "HEAD~1"
          }

          $changed = git diff --name-only $base $head -- "*.cs"
          $existing = @($changed | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path $_) })

          if ($existing.Count -eq 0)
          {
              "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
          }

          "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $existing | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check formatting
        if: steps.changed_cs.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $raw = @"
          ${{ steps.changed_cs.outputs.files }}
          "@
          $files = $raw -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          # TEMP DIAGNOSTIC: apply formatting for real, export the diff as an artifact so the
          # exact changes the formatter wants are readable locally (CI console eats CRLF diffs).
          dotnet format SalmonEgg.sln --no-restore --verbosity diagnostic --include $files
          Write-Host "=== core.autocrlf ==="
          git config --get core.autocrlf
          Write-Host "=== diff with autocrlf disabled ==="
          git -c core.autocrlf=false --no-pager diff --stat
          git -c core.autocrlf=false --no-pager diff | Out-File formatter-diff.txt -Encoding utf8
          Write-Host "=== first bytes of the 3 flagged files ==="
          foreach ($f in @('tests/SalmonEgg.Infrastructure.Tests/Observability/TelemetryRuntimeTests.cs','tests/SalmonEgg.Presentation.Core.Tests/Services/ApplicationShutdownWorkflowTests.cs','tests/SalmonEgg.Presentation.Core.Tests/Navigation/ShellShutdownOverlayViewModelTests.cs'))
          {
            (Get-Content $f -AsByteStream -TotalCount 240) -join ' '
          }
          exit 1

      - name: Upload formatter diff
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: formatter-diff
          path: |
            formatter-diff.txt
            formatter-stat.txt
          if-no-files-found: ignore

      - name: Build with analyzers
        run: dotnet build SalmonEgg.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:EnforceCodeStyleInBuild=true
