name: Platform Build Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: platform-build-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  linux-desktop:
    name: Linux Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Linux Desktop
        run: >-
          dotnet publish SalmonEgg/SalmonEgg/SalmonEgg.csproj
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-desktop
          --runtime linux-x64
          --self-contained false
          --output publish/linux-desktop

  macos-desktop:
    name: macOS Desktop
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish macOS Desktop
        run: >-
          dotnet publish SalmonEgg/SalmonEgg/SalmonEgg.csproj
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-desktop
          --runtime osx-arm64
          --self-contained false
          --output publish/macos-desktop

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update --disable-parallel --no-http-cache

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android
        run: >-
          dotnet build SalmonEgg/SalmonEgg/SalmonEgg.csproj
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-android36.0
          -p:EnableMobileTargets=true
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT

  ios:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install iOS workload
        run: dotnet workload install ios --skip-manifest-update --disable-parallel --no-http-cache

      - name: Build iOS Simulator
        run: >-
          dotnet build SalmonEgg/SalmonEgg/SalmonEgg.csproj
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-ios
          --runtime iossimulator-arm64
          -p:EnableMobileTargets=true
          -p:EnableIosTarget=true
