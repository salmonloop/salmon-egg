name: CI Core

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.3xx"
  CONFIGURATION: "Release"
  TEST_RESULTS_DIR: "TestResults"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update --disable-parallel --no-http-cache

      - name: Restore dependencies
        run: dotnet restore SalmonEgg.sln

      - name: Build
        run: dotnet build SalmonEgg.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        timeout-minutes: 20
        shell: pwsh
        run: |
          $testArgs = @(
            "test",
            "--solution", "SalmonEgg.sln",
            "--configuration", "${{ env.CONFIGURATION }}",
            "--no-build",
            "--verbosity", "normal",
            "--timeout", "20m",
            "--long-running", "300",
            "--results-directory", "${{ env.TEST_RESULTS_DIR }}",
            "--report-xunit-trx",
            "--coverlet",
            "--coverlet-output-format", "cobertura"
          )

          Write-Host "Running test pass 1..."
          dotnet @testArgs
          if ($LASTEXITCODE -eq 0)
          {
              exit 0
          }

          Write-Warning "Test pass 1 failed. Retrying once to filter transient flakiness..."
          dotnet @testArgs
          if ($LASTEXITCODE -ne 0)
          {
              exit $LASTEXITCODE
          }

      - name: Run Core Gate Script
        shell: pwsh
        run: ./scripts/gates/run-core-gates.ps1 -Configuration ${{ env.CONFIGURATION }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "${{ env.TEST_RESULTS_DIR }}/**/*.trx"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: "**/coverage*.xml"
