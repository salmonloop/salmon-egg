name: Windows Packaged GUI Acceptance

on:
  workflow_dispatch:
    inputs:
      reverse-verification:
        description: Rebuild a mutant and the restored package to prove the URL consent gate
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-packaged-gui-acceptance.yml'
      - 'scripts/gates/test-windows-interactive-desktop.ps1'
      - 'scripts/gates/run-windows-packaged-gui-acceptance.ps1'
      - 'scripts/gates/windows-elicitation-reverse-verification.py'
      - 'scripts/gates/fixtures/native-elicitation-peer.py'
      - 'scripts/gates/windows-desktop-probe/**'
      - 'tests/SalmonEgg.GuiTests.Windows/**'
      - '.tools/run-winui3-msix.ps1'
      - 'src/SalmonEgg.Infrastructure/Services/PlatformCapabilityService.cs'
      - 'src/SalmonEgg.Infrastructure.Desktop/Services/TerminalAuthenticationSessionFactory*'
      - 'src/SalmonEgg.Presentation.Core/ViewModels/Chat/Elicitation/**'
      - 'SalmonEgg/SalmonEgg/DependencyInjection.cs'
      - 'SalmonEgg/SalmonEgg/Controls/XtermTerminalView*'
      - 'SalmonEgg/SalmonEgg/Assets/Terminal/**'
      - 'SalmonEgg/SalmonEgg/Platforms/NativeElicitationUriLauncher.cs'
      - 'SalmonEgg/SalmonEgg/Presentation/Services/UnoAppLanguageService.cs'
      - 'SalmonEgg/SalmonEgg/Presentation/Views/Chat/ChatView.xaml'
      - 'SalmonEgg/SalmonEgg/Presentation/Views/Chat/TerminalAuthenticationDialog*'
      - 'SalmonEgg/SalmonEgg/Presentation/Services/TerminalAuthenticationInteraction.cs'

permissions:
  contents: read

concurrency:
  group: windows-packaged-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-gui:
    name: Windows Installed WinUI GUI
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      DOTNET_PROCESSOR_COUNT: '2'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify the hosted interactive desktop with real input
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/gates/test-windows-interactive-desktop.ps1
      - name: Build, sign and install this commit's MSIX
        timeout-minutes: 35
        shell: pwsh
        run: ./.tools/run-winui3-msix.ps1 -Configuration Debug
      - name: Build the Windows GUI test application
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet build tests/SalmonEgg.GuiTests.Windows/SalmonEgg.GuiTests.Windows.csproj `
            --configuration Debug -p:UseSharedCompilation=false -m:1 --disable-build-servers
      - name: Exercise the current installed WinUI application
        timeout-minutes: 9
        shell: pwsh
        run: ./scripts/gates/run-windows-packaged-gui-acceptance.ps1
      - name: Prove URL consent rejection and the restored installed product
        if: github.event_name == 'workflow_dispatch' && inputs.reverse-verification
        timeout-minutes: 40
        shell: pwsh
        run: python scripts/gates/windows-elicitation-reverse-verification.py
      - name: Upload installed-product and desktop evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-packaged-gui-acceptance
          path: |
            artifacts/windows-packaged-gui
            artifacts/msix/current-install.json
            artifacts/logs/msix/*.log
            artifacts/windows-elicitation-reverse/**
          if-no-files-found: error
