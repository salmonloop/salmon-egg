name: ACP SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/SalmonEgg.Acp/**"
      - "src/SalmonEgg.Acp/README.md"
      - "tests/SalmonEgg.Acp.Tests/**"
      - "tests/SalmonEgg.Acp.Desktop.Tests/**"
      - "src/SalmonEgg.Infrastructure.Desktop/Transport/**"
      - "src/SalmonEgg.Infrastructure/Client/DomainAcpClientAdapters.cs"
      - "scripts/gates/run-acp-batch-stdio-gate.sh"
      - "scripts/gates/run-acp-official-v2-agent-gate.sh"
      - "scripts/gates/run-acp-sdk-gates.*"
      - "scripts/gates/run-acp-consumer-package-smoke.sh"
      - "scripts/gates/acp-v2-*-consumer.cs"
      - "scripts/gates/run-acp-sdk-tag-version-gate.sh"
      - "scripts/gates/run-acp-sdk-tag-version-gate-selftest.sh"
      - ".github/workflows/ci-acp-sdk.yml"
      - "Directory.Build.props"
      - "NuGet.config"
      - "global.json"
  pull_request:
    branches: [develop, main]
    paths:
      - "src/SalmonEgg.Acp/**"
      - "src/SalmonEgg.Acp/README.md"
      - "tests/SalmonEgg.Acp.Tests/**"
      - "tests/SalmonEgg.Acp.Desktop.Tests/**"
      - "src/SalmonEgg.Infrastructure.Desktop/Transport/**"
      - "src/SalmonEgg.Infrastructure/Client/DomainAcpClientAdapters.cs"
      - "scripts/gates/run-acp-batch-stdio-gate.sh"
      - "scripts/gates/run-acp-official-v2-agent-gate.sh"
      - "scripts/gates/run-acp-sdk-gates.*"
      - "scripts/gates/run-acp-consumer-package-smoke.sh"
      - "scripts/gates/acp-v2-*-consumer.cs"
      - "scripts/gates/run-acp-sdk-tag-version-gate.sh"
      - "scripts/gates/run-acp-sdk-tag-version-gate-selftest.sh"
      - ".github/workflows/ci-acp-sdk.yml"
      - "Directory.Build.props"
      - "NuGet.config"
      - "global.json"
  workflow_dispatch:

# Least privilege by default: every job here only reads the repository. The one job that needs to
# write (release asset upload) raises it locally. Without this block the workflow inherits whatever
# the repository default happens to be, which is a setting that can drift without a code change.
permissions:
  contents: read

concurrency:
  group: acp-sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: "Release"
  PACKAGE_OUTPUT: "artifacts/acp-sdk-pack"

jobs:
  upstream-v2-agent:
    name: Official ACP V2 Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run the pinned upstream Agent against this SDK
        run: bash scripts/gates/run-acp-official-v2-agent-gate.sh
      - name: Upload upstream interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acp-official-v2-agent
          path: |
            artifacts/acp-official-v2-agent/agent-build.log
            artifacts/acp-official-v2-agent/client.log
            artifacts/acp-official-v2-agent/*.txt
            artifacts/acp-official-v2-agent/*.sha256

  batch-stdio:
    name: ACP Batch Stdio (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_PROCESSOR_COUNT: "2"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify real stdio batches without skips
        run: bash scripts/gates/run-acp-batch-stdio-gate.sh Release
      - name: Upload stdio evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acp-batch-stdio
          path: artifacts/acp-batch-stdio/

  sdk-gates:
    name: ACP SDK Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The package version is derived from the acp-sdk-v* tag history by MinVer, so the full
      # history (tags included) must be present. A shallow clone would pack a 0.0.0-alpha version
      # and the baseline guard in SalmonEgg.Acp.csproj would fail the pack.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ACP SDK gate script
        env:
          DOTNET_BIN: dotnet
          # Every version after the first shipped one must package-validate against the last
          # published package. The baseline is stored as a repository variable, matching the
          # release workflow, so CI and release cannot disagree about what was last published.
          ACP_PACKAGE_BASELINE_VERSION: ${{ vars.ACP_PACKAGE_BASELINE_VERSION }}
        run: ./scripts/gates/run-acp-sdk-gates.sh "${{ env.CONFIGURATION }}" "${{ env.PACKAGE_OUTPUT }}"

      - name: Verify release tag/version gate rules
        run: ./scripts/gates/run-acp-sdk-tag-version-gate-selftest.sh

      - name: Upload ACP SDK package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acp-sdk-package
          path: "${{ env.PACKAGE_OUTPUT }}/*.nupkg"

  consumer-integration:
    name: ACP Consumer Integration
    needs: sdk-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download ACP SDK package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acp-sdk-package
          path: artifacts/acp-sdk-package

      - name: Run package consumer smoke
        env:
          DOTNET_BIN: dotnet
        run: ./scripts/gates/run-acp-consumer-package-smoke.sh artifacts/acp-sdk-package "${{ env.CONFIGURATION }}"
