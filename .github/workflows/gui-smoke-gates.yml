name: GUI Smoke Gates

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      # Documentation-only edits cannot change build or test outcomes, and running the heavy platform
      # matrix for them costs runner minutes while adding no signal. Listed explicitly rather than as
      # `**.md`: src/SalmonEgg.Acp/README.md is packed into the published nupkg, so it is shipping
      # content and must keep triggering its gates.
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      # Documentation-only edits cannot change build or test outcomes, and running the heavy platform
      # matrix for them costs runner minutes while adding no signal. Listed explicitly rather than as
      # `**.md`: src/SalmonEgg.Acp/README.md is packed into the published nupkg, so it is shipping
      # content and must keep triggering its gates.
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/FUNDING.yml"

# Least privilege by default: every job here only reads the repository. The one job that needs to
# write (release asset upload) raises it locally. Without this block the workflow inherits whatever
# the repository default happens to be, which is a setting that can drift without a code change.
permissions:
  contents: read

concurrency:
  group: gui-smoke-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SALMONEGG_GUI: "1"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  skia-desktop-gui-smoke:
    name: Skia Desktop GUI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install Skia Desktop GUI smoke runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libfreetype6 \
            fontconfig \
            libfontconfig1 \
            libgtk-3-0 \
            libx11-6 \
            libxtst6 \
            openbox \
            xdotool \
            x11-utils

      - name: Run Skia Desktop GUI smoke
        run: ./scripts/gates/run-skia-desktop-gui-smoke-gates.sh Debug

      - name: Verify native session status navigation
        timeout-minutes: 5
        env:
          SALMONEGG_NAV_MASK_SKIP_BUILD: "1"
          SALMONEGG_NAV_MASK_GROUPING: "Status"
          SALMONEGG_NAV_MASK_SESSIONS: "3"
          SALMONEGG_NAV_INTERACTION_PROBE: "1"
          SALMONEGG_NAV_MASK_PERSIST_DIR: ${{ runner.temp }}/session-status-navigation
          DOTNET_PROCESSOR_COUNT: "2"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 240s \
            bash scripts/gates/run-skia-nav-mask-probe.sh Debug

      - name: Upload session status navigation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: session-status-navigation
          path: ${{ runner.temp }}/session-status-navigation
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify visible reply read receipts
        timeout-minutes: 4
        env:
          SALMONEGG_READ_RECEIPT_RESULT_DIR: ${{ runner.temp }}/reply-read-receipts
          DOTNET_PROCESSOR_COUNT: "2"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 180s \
            bash scripts/gates/run-skia-read-receipt-probe.sh

      - name: Upload read receipt evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reply-read-receipts
          path: ${{ runner.temp }}/reply-read-receipts
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify ACP setup path editing with native keyboard input
        timeout-minutes: 3
        run: |
          python3 scripts/gates/skia-acp-setup-path-smoke.py \
            --no-build --artifacts "${RUNNER_TEMP}/acp-setup-path-smoke"

      - name: Upload ACP setup path evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: acp-setup-path-smoke
          path: ${{ runner.temp }}/acp-setup-path-smoke
          if-no-files-found: ignore

      - name: Verify native URL consent with the actual Linux product
        timeout-minutes: 5
        env:
          DOTNET_PROCESSOR_COUNT: "2"
        run: |
          test -x /usr/bin/google-chrome
          test -x /usr/bin/xdg-open
          python3 scripts/gates/skia-elicitation-consent-smoke.py --no-build \
            --chromium /usr/bin/google-chrome --artifacts "${RUNNER_TEMP}/native-elicitation-consent"

      - name: Upload native elicitation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: native-elicitation-consent
          path: |
            ${{ runner.temp }}/native-elicitation-consent/provenance.json
            ${{ runner.temp }}/native-elicitation-consent/result.json
            ${{ runner.temp }}/native-elicitation-consent/peer.jsonl
            ${{ runner.temp }}/native-elicitation-consent/stdout.log
          if-no-files-found: error

      # Retain the independent opener check: the product gate above owns consent and wire behavior.
      - name: Run Linux external browser isolation probe
        timeout-minutes: 3
        env:
          DOTNET_PROCESSOR_COUNT: "2"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          test -x /usr/bin/google-chrome
          test -x /usr/bin/xdg-open
          dotnet build scripts/gates/linux-elicitation-probe/linux-elicitation-probe.csproj \
            --configuration Release -p:UseSharedCompilation=false
          timeout --signal=TERM --kill-after=10s 70s python3 scripts/gates/linux-elicitation-browser-smoke.py \
            scripts/gates/linux-elicitation-probe/bin/Release/net10.0/SalmonEgg.Gates.LinuxElicitationProbe.dll \
            --dotnet "$(command -v dotnet)" --chromium /usr/bin/google-chrome

  deterministic-gui-smokes:
    name: Deterministic GUI Smoke Gates
    # This repository currently has no self-hosted Windows runner registered, so a dispatched run of
    # this job would queue until it timed out instead of failing fast — a gate that has never once
    # executed. The job stays wired for the day a runner exists, but it is enabled by an explicit
    # repository variable rather than by assuming a runner is there. Until then the FlaUI/UIA3 gate
    # is a local-only gate; see BUILD_GUIDE.md.
    runs-on: [self-hosted, windows]
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && vars.WINDOWS_GUI_SELF_HOSTED_RUNNER == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build GUI tests
        shell: pwsh
        run: ./scripts/gates/run-gui-smoke-gates.ps1
