name: Release Packaging

# One authoritative entry point: pushing a `v*` tag. docs/release-guide.md documents exactly that, and
# the workflow creates the GitHub release itself when the tag build reaches the publish job.
#
# `release: [created]` used to be a second entry. It made the same tag reachable through two independent
# runs — push the tag, then create a release from it in the UI, and both fire. Both then race to
# `gh release upload --clobber` on the same assets, and because the concurrency group keys on github.ref
# (which differs between the two events) neither cancels the other. Removing it costs nothing: creating a
# release from an existing tag no longer needs to rebuild what that tag already produced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default: every job here only reads the repository. The one job that needs to
# write (release asset upload) raises it locally. Without this block the workflow inherits whatever
# the repository default happens to be, which is a setting that can drift without a code change.
permissions:
  contents: read

concurrency:
  group: release-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: "Release"
  SALMONEGG_ONEDRIVE_CLIENT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_CLIENT_ID || vars.SALMONEGG_ONEDRIVE_CLIENT_ID }}
  SALMONEGG_ONEDRIVE_TENANT_ID: ${{ secrets.SALMONEGG_ONEDRIVE_TENANT_ID || vars.SALMONEGG_ONEDRIVE_TENANT_ID }}
  SALMONEGG_ONEDRIVE_REDIRECT_URI: ${{ secrets.SALMONEGG_ONEDRIVE_REDIRECT_URI || vars.SALMONEGG_ONEDRIVE_REDIRECT_URI }}
  SALMONEGG_ONEDRIVE_SCOPES: ${{ secrets.SALMONEGG_ONEDRIVE_SCOPES || vars.SALMONEGG_ONEDRIVE_SCOPES }}

jobs:
  package-wasm:
    name: Package WebAssembly
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update --disable-parallel --no-http-cache

      - name: Publish WebAssembly
        run: |
          cd SalmonEgg/SalmonEgg
          dotnet publish -f net10.0-browserwasm -c ${{ env.CONFIGURATION }} -o ../../publish/wasm

      # A green publish is not evidence the bundle boots. Assert the payload the browser actually needs
      # exists before this becomes a release asset.
      - name: Verify WebAssembly artifact contract
        shell: bash
        run: scripts/gates/run-release-artifact-contract-gate.sh wasm publish/wasm

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wasm-build
          path: publish/wasm

  package-desktop:
    name: Package Desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish Desktop (Windows)
        run: |
          cd SalmonEgg/SalmonEgg
          dotnet publish -f net10.0-desktop -c ${{ env.CONFIGURATION }} -o ../../publish/desktop-windows

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress

      - name: Build Windows Skia MSI
        shell: pwsh
        run: |
          $desktopDir = Join-Path $env:GITHUB_WORKSPACE "publish\desktop-windows"
          if (-not (Test-Path $desktopDir)) {
            throw "Desktop publish output not found: $desktopDir"
          }

          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

          # Evaluate the shared release identity instead of scraping project XML. The version comes
          # from the git tag via MinVer, so running the MinVer target is what produces it; the checkout
          # above uses fetch-depth: 0 so the tag is reachable. Only MSBuild evaluation sees imports and
          # conditions the way the build itself does.
          $displayVersion = (dotnet msbuild src/SalmonEgg.Cli/SalmonEgg.Cli.csproj -restore -t:MinVer -getProperty:SalmonEggDisplayVersion -nologo).Trim()
          if ($displayVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "SalmonEggDisplayVersion must be a three-part numeric version, got: $displayVersion"
          }

          $harvestPath = Join-Path $installerDir "Harvest.wxs"
          heat dir $desktopDir `
            -cg SalmonEggDesktopFiles `
            -dr INSTALLFOLDER `
            -var var.DesktopPublishDir `
            -srd `
            -sreg `
            -sfrag `
            -gg `
            -out $harvestPath

          $productPath = Join-Path $installerDir "Product.wxs"
          $productXml = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            "  <Product Id=`"*`" Name=`"SalmonEgg (Desktop)`" Language=`"1033`" Version=`"$displayVersion`" Manufacturer=`"SalmonLoop`" UpgradeCode=`"A2F958DF-D4A4-4E9A-A487-E7CFF31E3271`">"
            '    <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" InstallPrivileges="limited" />'
            '    <MajorUpgrade DowngradeErrorMessage="A newer version of SalmonEgg is already installed." />'
            '    <MediaTemplate EmbedCab="yes" />'
            '    <Feature Id="MainFeature" Title="SalmonEgg Desktop" Level="1">'
            '      <ComponentGroupRef Id="SalmonEggDesktopFiles" />'
            '    </Feature>'
            '    <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />'
            '    <UIRef Id="WixUI_InstallDir" />'
            '    <UIRef Id="WixUI_ErrorProgressText" />'
            '  </Product>'
            '  <Fragment>'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            '      <Directory Id="LocalAppDataFolder">'
            '        <Directory Id="INSTALLFOLDER" Name="SalmonEgg" />'
            '      </Directory>'
            '    </Directory>'
            '  </Fragment>'
            '</Wix>'
          )
          Set-Content -Path $productPath -Encoding UTF8 -Value $productXml

          $wixObjDir = Join-Path $installerDir "obj"
          New-Item -ItemType Directory -Force -Path $wixObjDir | Out-Null

          candle `
            -ext WixUIExtension `
            -dDesktopPublishDir="$desktopDir" `
            -out (Join-Path $wixObjDir "") `
            $productPath `
            $harvestPath

          $msiPath = Join-Path $installerDir "SalmonEgg-desktop-x64.msi"
          light `
            -ext WixUIExtension `
            -cultures:en-us `
            -sice:ICE38 `
            -sice:ICE64 `
            -out $msiPath `
            (Join-Path $wixObjDir "Product.wixobj") `
            (Join-Path $wixObjDir "Harvest.wixobj")

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-windows-build
          path: publish/desktop-windows

      # The CLI MSI verifies its own Environment table (scripts/release/build-cli-msi.ps1); this MSI had
      # no equivalent, so a heat harvest that picked up nothing would still emit a valid, installable,
      # and empty package. Read the built package's own tables rather than trusting the authoring above.
      #
      # The rule itself lives in scripts/release/DesktopMsiContract.ps1 so that
      # scripts/gates/run-desktop-msi-contract-gate.ps1 can rehearse it on every push. It used to be
      # inline here, and being unrehearsable is how it shipped with `SELECT COUNT(*)` -- SQL Windows
      # Installer cannot parse -- and took down the v1.3.0 release build from inside OpenView.
      #
      # Native COM calls, matching build-cli-msi.ps1 after 2690a1eb: the GetType().InvokeMember(...) form
      # was tried and replaced there, and GitHubWorkflowContractTests pins the native shape. Using the
      # rejected form here would reintroduce what that commit removed.
      - name: Verify Windows Skia MSI contract
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path artifacts/installer -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw "No .msi was produced under artifacts/installer."
          }

          . ./scripts/release/DesktopMsiContract.ps1

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          try {
            Assert-DesktopMsiContract -Database $database
          }
          finally {
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($database)
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
          }
      - name: Upload Windows Skia MSI artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-windows-skia-msi
          path: artifacts/installer/*.msi

  package-windows-msix:
    name: Package Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore WinUI app for isolated MSIX build
        shell: pwsh
        run: |
          dotnet msbuild `
            SalmonEgg/SalmonEgg/SalmonEgg.csproj `
            /t:Restore `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:TargetFramework=net10.0-windows10.0.26100.0 `
            /p:EnableWinUIBuild=true `
            /p:IsolatedMsixBuild=true `
            /p:BuildProjectReferences=false `
            /p:DisableCustomWinSdkXamlReferences=true `
            /v:minimal

      - name: Build net10.0 project references
        shell: pwsh
        run: |
          dotnet build `
            src/SalmonEgg.Presentation.Core/SalmonEgg.Presentation.Core.csproj `
            -c ${{ env.CONFIGURATION }} `
            -f net10.0 `
            -v minimal
          dotnet build `
            src/SalmonEgg.Infrastructure.Desktop/SalmonEgg.Infrastructure.Desktop.csproj `
            -c ${{ env.CONFIGURATION }} `
            -f net10.0 `
            -v minimal

      - name: Prepare MSIX signing certificate
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) {
            throw "MSIX signing secrets missing. Set MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD in repo secrets."
          }

          $certDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\signing"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "salmonegg-msix.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))

          $expectedPublisher = "CN=0B694F0E-510C-433A-A6F7-1484D6A39E19"
          $certPassword = ConvertTo-SecureString $env:MSIX_PFX_PASSWORD -AsPlainText -Force
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:MSIX_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          if (-not $certificate.HasPrivateKey) {
            throw "MSIX signing certificate does not contain a private key."
          }
          if ($certificate.Subject -ne $expectedPublisher) {
            throw "MSIX signing certificate subject '$($certificate.Subject)' does not match '$expectedPublisher'."
          }
          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw "MSIX signing certificate expired at $($certificate.NotAfter.ToUniversalTime().ToString('o'))."
          }
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $certPassword | Out-Null
          "MSIX_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Windows MSIX
        shell: pwsh
        run: |
          dotnet msbuild `
            SalmonEgg/SalmonEgg/SalmonEgg.csproj `
            /t:Publish `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:TargetFramework=net10.0-windows10.0.26100.0 `
            /p:PublishProfile=Properties/PublishProfiles/win-msix-x64.pubxml `
            /p:EnableWinUIBuild=true `
            /p:IsolatedMsixBuild=true `
            /p:BuildProjectReferences=false `
            /p:DisableCustomWinSdkXamlReferences=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:MSIX_CERT_THUMBPRINT" `
            /p:Restore=false `
            /v:minimal

      # Same contract the PR-level packaging gate enforces, applied to the signed package that actually
      # ships. A signed package with missing shell assets is still a package with missing shell assets.
      - name: Verify MSIX package contract
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts/msix -Recurse -Filter *.msix |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "MSIX publish produced no .msix under artifacts/msix."
          }

          ./scripts/gates/run-msix-package-contract-gate.ps1 -Package $package.FullName

      - name: Upload Windows MSIX artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-windows-msix
          path: artifacts/msix/**/*.msix

  package-macos:
    name: Package macOS
    runs-on: macos-15
    timeout-minutes: 60
    # Signing secrets are job-scoped env, so downstream jobs cannot re-evaluate them. Publish the
    # single fact the release job actually needs: whether a .dmg was produced and uploaded.
    outputs:
      dmg-produced: ${{ steps.collect-dmg.outputs.dmg-produced }}
    env:
      MACOS_RID: osx-arm64
      MACOS_APP_CODESIGN_KEY: ${{ secrets.MACOS_APP_CODESIGN_KEY }}
      MACOS_DMG_CODESIGN_KEY: ${{ secrets.MACOS_DMG_CODESIGN_KEY }}
      MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish macOS app bundle
        shell: pwsh
        run: |
          cd SalmonEgg/SalmonEgg
          $codesignArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:MACOS_APP_CODESIGN_KEY))
          {
            $codesignArgs += "-p:CodesignKey=$env:MACOS_APP_CODESIGN_KEY"
          }

          dotnet publish `
            -f net10.0-desktop `
            -c ${{ env.CONFIGURATION }} `
            -r $env:MACOS_RID `
            -p:PackageFormat=app `
            -p:RuntimeIdentifiers=$env:MACOS_RID `
            @codesignArgs

      - name: Collect macOS app bundle
        run: |
          set -euo pipefail
          mkdir -p publish/macos-bundle
          APP_PATH=$(find SalmonEgg/SalmonEgg/bin/${{ env.CONFIGURATION }}/net10.0-desktop/${MACOS_RID}/publish -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in Uno publish output"
            exit 1
          fi
          cp -R "$APP_PATH" publish/macos-bundle/

      - name: Publish macOS disk image
        if: env.MACOS_APP_CODESIGN_KEY != '' && env.MACOS_DMG_CODESIGN_KEY != ''
        shell: pwsh
        run: |
          cd SalmonEgg/SalmonEgg
          $notaryArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:MACOS_NOTARY_PROFILE))
          {
            $notaryArgs += "-p:UnoMacOSNotarizeKeychainProfile=$env:MACOS_NOTARY_PROFILE"
          }

          dotnet publish `
            -f net10.0-desktop `
            -c ${{ env.CONFIGURATION }} `
            -r $env:MACOS_RID `
            -p:SelfContained=true `
            -p:PackageFormat=dmg `
            -p:RuntimeIdentifiers=$env:MACOS_RID `
            -p:CodesignKey=$env:MACOS_APP_CODESIGN_KEY `
            -p:DiskImageSigningKey=$env:MACOS_DMG_CODESIGN_KEY `
            @notaryArgs

      - name: Collect macOS disk image
        id: collect-dmg
        if: env.MACOS_APP_CODESIGN_KEY != '' && env.MACOS_DMG_CODESIGN_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p publish/dmg
          DMG_PATH=$(find SalmonEgg/SalmonEgg/bin/${{ env.CONFIGURATION }}/net10.0-desktop/${MACOS_RID}/publish -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found in Uno publish output"
            exit 1
          fi
          cp "$DMG_PATH" publish/dmg/
          echo "dmg-produced=true" >> "$GITHUB_OUTPUT"

      # The bundle is a directory contract, and an Info.plist naming an executable that is not there
      # produces an app that installs and then does nothing. Check it here, not after a user reports it.
      - name: Verify macOS bundle contract
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find publish/macos-bundle -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was collected." >&2
            exit 1
          fi
          scripts/gates/run-release-artifact-contract-gate.sh macos-bundle "$APP_PATH"

      - name: Upload macOS bundle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-macos-bundle
          path: publish/macos-bundle/*

      - name: Upload macOS .dmg artifact
        if: env.MACOS_APP_CODESIGN_KEY != '' && env.MACOS_DMG_CODESIGN_KEY != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-macos-dmg
          path: publish/dmg/*.dmg

  package-cli:
    # One job per officially supported CLI runtime identifier. Each publishes on its own native runner,
    # smokes the executable it just produced, and only then packages it — a cross-compiled artifact that
    # nothing has executed is not something this repository is willing to release.
    name: Package CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
            deb-architecture: amd64
          - rid: win-x64
            runs-on: windows-latest
          # Pinned for the same reason as the macOS package job: a rolling image alias silently changes
          # the toolchain that produced a released binary.
          - rid: osx-arm64
            runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build CLI artifact
        id: build-cli
        shell: bash
        run: scripts/release/build-cli-artifacts.sh --rid ${{ matrix.rid }} --configuration ${{ env.CONFIGURATION }}

      - name: Smoke the published CLI executable
        shell: bash
        run: scripts/gates/run-cli-release-artifact-smoke.sh "${{ steps.build-cli.outputs.executable-path }}"

      - name: Build Debian package
        if: matrix.deb-architecture != ''
        id: build-deb
        shell: bash
        run: >-
          scripts/release/build-cli-deb.sh
          --executable "${{ steps.build-cli.outputs.executable-path }}"
          --version "${{ steps.build-cli.outputs.display-version }}"
          --architecture ${{ matrix.deb-architecture }}

      - name: Smoke the Debian package install and PATH registration
        if: matrix.deb-architecture != ''
        shell: bash
        run: scripts/gates/run-cli-linux-package-smoke.sh "${{ steps.build-deb.outputs.deb-path }}"

      - name: Install WiX Toolset
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build Windows MSI
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          CLI_EXECUTABLE: ${{ steps.build-cli.outputs.executable-path }}
          CLI_VERSION: ${{ steps.build-cli.outputs.display-version }}
        run: |
          $executable = $env:CLI_EXECUTABLE
          if ($executable -match '^/([A-Za-z])/(.+)$') {
            $executable = "$($matches[1].ToUpperInvariant()):\$($matches[2] -replace '/', '\')"
          }

          ./scripts/release/build-cli-msi.ps1 -Executable $executable -Version $env:CLI_VERSION

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cli-${{ matrix.rid }}
          path: |
            artifacts/cli/*.tar.gz
            artifacts/cli/*.zip
            artifacts/cli/*.deb
            artifacts/cli/*.msi
            artifacts/cli/*.sha256
          if-no-files-found: error

  publish-release-assets:
    name: Publish Release Assets
    needs: [package-wasm, package-desktop, package-windows-msix, package-macos, package-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only a tag build publishes. workflow_dispatch remains available for rehearsing the packaging jobs
    # without creating or touching a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download Windows MSIX artifact
        if: needs.package-windows-msix.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-windows-msix
          path: windows-msix

      - name: Download WebAssembly artifact
        if: needs.package-wasm.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wasm-build
          path: wasm-build

      - name: Download Windows Skia MSI artifact
        if: needs.package-desktop.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-windows-skia-msi
          path: windows-skia-msi

      - name: Download macOS bundle artifact
        if: needs.package-macos.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-macos-bundle
          path: macos-bundle

      - name: Download macOS .dmg artifact
        if: needs.package-macos.outputs.dmg-produced == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-macos-dmg
          path: macos-dmg

      - name: Checkout for release tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: repo
          fetch-depth: 0

      - name: Download CLI artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-artifacts

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --verify-tag --generate-notes

      - name: Prepare release bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Copy Windows MSIX package when available
          if [ -d "windows-msix" ]; then
            MSIX_PATH=$(find windows-msix -name "*.msix" -print -quit)
            if [ -n "${MSIX_PATH}" ]; then
              cp "${MSIX_PATH}" release-assets/
            fi
          fi

          # Copy Windows Skia MSI when available
          if [ -d "windows-skia-msi" ]; then
            MSI_PATH=$(find windows-skia-msi -name "*.msi" -print -quit)
            if [ -n "${MSI_PATH}" ]; then
              cp "${MSI_PATH}" release-assets/
            fi
          fi

          # Copy DMG when signing is configured
          if [ -d "macos-dmg" ]; then
            DMG_PATH=$(find macos-dmg -maxdepth 1 -name "*.dmg" -print -quit)
            if [ -n "${DMG_PATH}" ]; then
              cp "${DMG_PATH}" release-assets/
            fi
          fi

          # Package macOS .app as zip for release
          if [ -d "macos-bundle" ]; then
            APP_PATH=$(find macos-bundle -maxdepth 2 -name "*.app" -print -quit)
            if [ -n "${APP_PATH}" ]; then
              APP_DIR=$(dirname "${APP_PATH}")
              APP_NAME=$(basename "${APP_PATH}")
              (
                cd "${APP_DIR}"
                zip -r "${GITHUB_WORKSPACE}/release-assets/${APP_NAME}.zip" "${APP_NAME}"
              )
            fi
          fi

          # Package WebAssembly output as zip
          if [ -d "wasm-build" ]; then
            zip -r "release-assets/SalmonEgg-wasm.zip" "wasm-build"
          fi

      - name: Prepare CLI release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Every supported runtime identifier must be present. A release that silently ships two of the
          # three advertised platforms is worse than a failed release: the support matrix in the docs would
          # be wrong for whoever downloads it.
          supported_rids="$(cd repo && dotnet msbuild src/SalmonEgg.Cli/SalmonEgg.Cli.csproj \
            -getProperty:SalmonEggCliSupportedRuntimeIdentifiers -nologo | tr -d '\r' | tail -n 1)"
          display_version="$(cd repo && dotnet msbuild src/SalmonEgg.Cli/SalmonEgg.Cli.csproj \
            -restore -t:MinVer -getProperty:SalmonEggDisplayVersion -nologo | tr -d '\r' | tail -n 1)"

          missing=""
          IFS=';' read -ra rids <<< "$supported_rids"
          for rid in "${rids[@]}"; do
            [ -n "$rid" ] || continue
            case "$rid" in
              win-*) archive="salmon-egg-cli-$display_version-$rid.zip" ;;
              *) archive="salmon-egg-cli-$display_version-$rid.tar.gz" ;;
            esac
            if [ ! -f "cli-artifacts/$archive" ]; then
              missing="$missing $archive"
              continue
            fi
            if [ ! -f "cli-artifacts/$archive.sha256" ]; then
              missing="$missing $archive.sha256"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing CLI release assets for the supported matrix ($supported_rids):$missing" >&2
            exit 1
          fi

          cp cli-artifacts/*.tar.gz cli-artifacts/*.zip cli-artifacts/*.sha256 release-assets/

          # Installer packages are copied only when present. An unmatched glob would otherwise pass the
          # literal pattern to cp and fail the whole job under `set -e`.
          find cli-artifacts -maxdepth 1 -type f \( -name '*.deb' -o -name '*.msi' \) \
            -exec cp {} release-assets/ \;

          # The formula's checksums are read from the sidecars produced by this run, so it can only ever
          # describe archives that were actually built and uploaded.
          repo/scripts/release/build-cli-homebrew-formula.sh \
            --version "$display_version" \
            --release-tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --artifact-dir cli-artifacts \
            --output release-assets/salmon-egg-cli.rb

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" release-assets/* --repo "${GH_REPO}" --clobber
